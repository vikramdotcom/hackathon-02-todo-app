# Phase V Backend - Local Development Environment
# Includes: Backend API, PostgreSQL, Redpanda (Kafka-compatible), Dapr

version: '3.8'

services:
  # ============================================================================
  # PostgreSQL Database
  # ============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: todo-postgres
    environment:
      POSTGRES_USER: todo_user
      POSTGRES_PASSWORD: todo_password
      POSTGRES_DB: todo_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo_user -d todo_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Redpanda (Kafka-compatible) - Local Development
  # ============================================================================
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.3
    container_name: todo-redpanda
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --smp 1
      - --memory 1G
      - --mode dev-container
      - --default-log-level=info
    ports:
      - "18081:18081"  # Schema Registry
      - "18082:18082"  # Pandaproxy
      - "19092:19092"  # Kafka API
      - "19644:9644"   # Admin API
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ============================================================================
  # Redpanda Console (UI for Kafka)
  # ============================================================================
  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.4.3
    container_name: todo-redpanda-console
    environment:
      KAFKA_BROKERS: redpanda:9092
      KAFKA_SCHEMAREGISTRY_ENABLED: true
      KAFKA_SCHEMAREGISTRY_URLS: http://redpanda:8081
    ports:
      - "8080:8080"
    depends_on:
      - redpanda

  # ============================================================================
  # Backend API (with Dapr sidecar)
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: todo-backend
    environment:
      DATABASE_URL: postgresql://todo_user:todo_password@postgres:5432/todo_db
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      DAPR_HTTP_PORT: 3500
      DAPR_GRPC_PORT: 50001
      ENVIRONMENT: development
      DEBUG: "true"
      LOG_LEVEL: info
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./migrations:/app/migrations
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ============================================================================
  # Dapr Sidecar for Backend
  # ============================================================================
  backend-dapr:
    image: daprio/daprd:1.12.0
    container_name: todo-backend-dapr
    command:
      [
        "./daprd",
        "-app-id", "todo-backend",
        "-app-port", "8000",
        "-dapr-http-port", "3500",
        "-dapr-grpc-port", "50001",
        "-components-path", "/components",
        "-config", "/config/config.yaml"
      ]
    volumes:
      - ../k8s/dapr-components:/components
      - ./dapr-config:/config
    network_mode: "service:backend"
    depends_on:
      - backend

  # ============================================================================
  # Dapr Placement Service (for Actors)
  # ============================================================================
  dapr-placement:
    image: daprio/dapr:1.12.0
    container_name: todo-dapr-placement
    command: ["./placement", "-port", "50006"]
    ports:
      - "50006:50006"

volumes:
  postgres_data:
    driver: local

networks:
  default:
    name: todo-network

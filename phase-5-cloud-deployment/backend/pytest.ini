[pytest]
# Pytest Configuration for Phase V Backend

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    -p no:cacheprovider

# Coverage options (when using --cov)
# Run with: pytest --cov=app --cov-report=html
[coverage:run]
source = app
omit = 
    */tests/*
    */migrations/*
    */__pycache__/*
    */venv/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

# Markers for test categorization
markers =
    unit: Unit tests for models and services
    integration: Integration tests for API endpoints
    slow: Tests that take longer to run
    database: Tests that require database access
    api: API endpoint tests
    recurrence: Tests for recurring task functionality

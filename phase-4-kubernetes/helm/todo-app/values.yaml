# Default values for todo-app Helm chart
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Global settings
global:
  namespace: todo-app
  environment: development

# Frontend configuration
frontend:
  enabled: true
  replicaCount: 2

  image:
    repository: todo-frontend
    tag: latest
    pullPolicy: Never  # Use Never for Minikube, change to IfNotPresent for production

  service:
    type: ClusterIP
    port: 3000
    targetPort: 3000

  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  livenessProbe:
    httpGet:
      path: /
      port: 3000
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /
      port: 3000
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

  env:
    nodeEnv: production

# Backend configuration
backend:
  enabled: true
  replicaCount: 2

  image:
    repository: todo-backend
    tag: latest
    pullPolicy: Never  # Use Never for Minikube, change to IfNotPresent for production

  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000

  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  livenessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

  env:
    logLevel: info

# Database configuration
database:
  enabled: true
  replicaCount: 1

  image:
    repository: postgres
    tag: 15-alpine
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 5432
    targetPort: 5432

  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  persistence:
    enabled: true
    storageClass: standard
    accessMode: ReadWriteOnce
    size: 5Gi

  livenessProbe:
    exec:
      command:
        - pg_isready
        - -U
        - postgres
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    exec:
      command:
        - pg_isready
        - -U
        - postgres
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

  env:
    postgresDb: todo_db

# Ingress configuration
ingress:
  enabled: true
  className: nginx
  host: todo.local
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"

# ConfigMap data
config:
  nextPublicApiUrl: "http://todo.local/api"
  databaseHost: "database"
  databasePort: "5432"
  databaseName: "todo_db"
  logLevel: "info"
  environment: "development"

# Secrets (these should be overridden in production)
# For production, use external secret management or sealed secrets
secrets:
  postgresUser: "postgres"
  postgresPassword: "postgres"
  databaseUrl: "postgresql://postgres:postgres@database:5432/todo_db"
  secretKey: "your-secret-key-here-change-in-production"
  openaiApiKey: ""  # Optional - for AI chatbot

# Autoscaling (disabled by default)
autoscaling:
  enabled: false
  frontend:
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  backend:
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80

# Pod disruption budgets (disabled by default)
podDisruptionBudget:
  enabled: false
  frontend:
    minAvailable: 1
  backend:
    minAvailable: 1

# Network policies (disabled by default)
networkPolicy:
  enabled: false

# Service monitor for Prometheus (disabled by default)
serviceMonitor:
  enabled: false
  interval: 30s

apiVersion: v1
kind: ConfigMap
metadata:
  name: todo-app-config
  namespace: todo-app
  labels:
    app: todo-app
data:
  # Frontend configuration
  NEXT_PUBLIC_API_URL: "http://todo.local/api"

  # Backend configuration
  DATABASE_HOST: "database"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "todo_db"

  # Application settings
  LOG_LEVEL: "info"
  ENVIRONMENT: "development"

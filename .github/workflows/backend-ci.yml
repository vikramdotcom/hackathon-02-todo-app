name: Backend CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'phase-5-cloud-deployment/backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'phase-5-cloud-deployment/backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      working-directory: phase-5-cloud-deployment/backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests with pytest
      working-directory: phase-5-cloud-deployment/backend
      run: |
        pytest -v --cov=app --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./phase-5-cloud-deployment/backend/coverage.xml
        flags: backend
        name: backend-coverage

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install black flake8 mypy

    - name: Run black
      working-directory: phase-5-cloud-deployment/backend
      run: black --check app/ tests/

    - name: Run flake8
      working-directory: phase-5-cloud-deployment/backend
      run: flake8 app/ tests/ --max-line-length=100 --extend-ignore=E203,W503

    - name: Run mypy
      working-directory: phase-5-cloud-deployment/backend
      run: mypy app/ --ignore-missing-imports

  docker:
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      working-directory: phase-5-cloud-deployment/backend
      run: |
        docker build -t todo-backend:test .

    - name: Test Docker image
      run: |
        docker run --rm todo-backend:test python -c "import app; print('Import successful')"

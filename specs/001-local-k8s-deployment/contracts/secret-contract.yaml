# Secret Resource Contract

**Resource Type**: Secret (v1)
**Purpose**: Store sensitive configuration data (passwords, API keys, tokens)

## Schema

```yaml
apiVersion: v1
kind: Secret
metadata:
  name: <secret-name>
  namespace: <namespace>
  labels:
    app: <service-name>
type: <secret-type>
data:
  <key>: <base64-encoded-value>
stringData:
  <key>: <plain-text-value>
```

## Field Constraints

| Field | Type | Required | Constraints |
|-------|------|----------|-------------|
| `metadata.name` | string | Yes | Lowercase alphanumeric + hyphens, max 253 chars |
| `metadata.namespace` | string | Yes | Must exist before Secret |
| `type` | enum | Yes | Opaque, kubernetes.io/tls, kubernetes.io/dockerconfigjson |
| `data` | map[string]string | No | Base64-encoded key-value pairs |
| `stringData` | map[string]string | No | Plain-text key-value pairs (auto-encoded) |

## Secret Types

### Opaque (Default)
Generic secret for arbitrary data:
```yaml
type: Opaque
```

### TLS Certificate
For TLS/SSL certificates:
```yaml
type: kubernetes.io/tls
data:
  tls.crt: <base64-cert>
  tls.key: <base64-key>
```

### Docker Registry
For private container registry authentication:
```yaml
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: <base64-docker-config>
```

## Usage Patterns

### Environment Variables
Inject Secret values as environment variables:

```yaml
env:
- name: OPENAI_API_KEY
  valueFrom:
    secretKeyRef:
      name: backend-secrets
      key: openai-api-key
```

### Volume Mount
Mount Secret as files:

```yaml
volumes:
- name: secrets
  secret:
    secretName: backend-secrets
volumeMounts:
- name: secrets
  mountPath: /app/secrets
  readOnly: true
```

## Examples

### Backend Secrets

```yaml
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: todo-app
  labels:
    app: backend
type: Opaque
stringData:
  database-url: "postgresql://user:password@database:5432/todos"
  openai-api-key: "sk-..."
  jwt-secret: "your-secret-key-here"
  secret-key: "your-secret-key-here"
```

### Database Secrets

```yaml
apiVersion: v1
kind: Secret
metadata:
  name: database-secrets
  namespace: todo-app
  labels:
    app: database
type: Opaque
stringData:
  postgres-password: "secure-password-here"
  postgres-user: "todouser"
  postgres-db: "todos"
```

### TLS Secret (Optional)

```yaml
apiVersion: v1
kind: Secret
metadata:
  name: todo-tls
  namespace: todo-app
type: kubernetes.io/tls
data:
  tls.crt: LS0tLS1CRUdJTi...  # Base64-encoded certificate
  tls.key: LS0tLS1CRUdJTi...  # Base64-encoded private key
```

## Creating Secrets

### From Literal Values
```bash
kubectl create secret generic backend-secrets \
  --from-literal=openai-api-key=sk-... \
  --from-literal=jwt-secret=your-secret \
  -n todo-app
```

### From Files
```bash
kubectl create secret generic backend-secrets \
  --from-file=openai-api-key=./openai-key.txt \
  --from-file=jwt-secret=./jwt-secret.txt \
  -n todo-app
```

### From TLS Certificate
```bash
kubectl create secret tls todo-tls \
  --cert=tls.crt \
  --key=tls.key \
  -n todo-app
```

## Validation Rules

1. **Sensitive Data Only**: Only store passwords, API keys, tokens, certificates
2. **Base64 Encoding**: Use `stringData` for plain text (auto-encoded) or `data` for pre-encoded
3. **Size Limit**: Secrets have a 1MB size limit
4. **Encryption at Rest**: Enabled by default in Minikube
5. **Naming Convention**: Use `<service-name>-secrets` format

## Security Best Practices

- Never commit secrets to version control
- Use `.env.example` files with placeholder values
- Rotate secrets regularly
- Use RBAC to restrict secret access
- Consider external secret management (Vault, Sealed Secrets) for production
- Use `stringData` instead of manually base64-encoding values
- Mark secrets as immutable when possible
